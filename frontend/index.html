<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CineMatch | Movie Recommendation</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🎬 CineMatch</h1>
        <p>Discover movies you'll love.</p>
    </header>

    <main>

        <section class="search-section">

            <h2>Enter Movie </h2>

            <input
                type="text"
                id="movieSearch"
                placeholder="Search movies..."
            >

            <button id="searchBtn">Search</button>

            <div id="searchResults"></div>

        </section>

        <section class="recommend-section">

            <h2>Get Recommendations</h2>

            <p id="selectedMovie">
                No movie selected
            </p>

            <label for="userId">User ID</label>

            <input
                type="number"
                id="userId"
                value="1"
                min="1"
            >

            <button id="recommendBtn">
                Recommend Movies
            </button>

        </section>

        <section class="results-section">

            <h2>Recommended For You</h2>

            <div id="recommendations" class="movie-grid"></div>

        </section>

    </main>

    <footer>
        <p>Hybrid Movie Recommendation System | AI & Data Science</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
